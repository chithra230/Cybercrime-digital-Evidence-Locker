<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence Review - Cybercrime Evidence Locker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#071a2d;color:white;min-height:100vh}
.navbar{background:#0b263b;padding:18px 35px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1b4057}
.logo{color:#2ed6b0;font-size:22px;font-weight:bold}.back-btn{background:#3498db;color:white;border:0;padding:10px 18px;border-radius:7px;cursor:pointer;font-weight:bold}
.container{width:94%;max-width:1200px;margin:30px auto}.card{background:#0b263b;border:1px solid #1b4057;border-radius:12px;padding:25px;margin-bottom:22px}
h1{font-size:28px;margin-bottom:8px}.subtitle{color:#9eb6c5;margin-bottom:25px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info{background:#071a2d;border:1px solid #1b4057;padding:15px;border-radius:8px}.label{color:#8fa8b8;font-size:12px;margin-bottom:6px}.value{word-break:break-word;line-height:1.5}
.status{display:inline-block;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold}.pending{background:#806600;color:#ffeaa7}.approved{background:#075c4c;color:#7ff5d8}.rejected{background:#6b211c;color:#ffaaa2}
.viewer{height:600px;background:#000;border:1px solid #31536a;border-radius:10px;overflow:hidden;margin-top:20px}.viewer iframe{width:100%;height:100%;border:0}.unsupported{height:100%;display:flex;align-items:center;justify-content:center;color:#9eb6c5;text-align:center;padding:30px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;padding:12px 18px;border-radius:7px;cursor:pointer;font-weight:bold}.approve{background:#2ed6b0;color:#071a2d}.reject{background:#e74c3c;color:white}.delete{background:#8e44ad;color:white}.download{background:#3498db;color:white}.message{margin-top:15px;font-weight:bold;color:#2ed6b0}.error{color:#ffaaa2}
@media(max-width:700px){.navbar{padding:15px;gap:12px}.info-grid{grid-template-columns:1fr}.viewer{height:450px}}
</style>
</head>
<body>
<div class="navbar"><div class="logo">CYBERCRIME EVIDENCE LOCKER</div><button class="back-btn" onclick="backToDashboard()">↩ Back to Dashboard</button></div>
<div class="container">
<div class="card"><h1>Evidence Review</h1><p class="subtitle">View and verify digital evidence before accepting or rejecting it.</p><div id="info">Loading evidence...</div><div class="actions" id="actions" style="display:none"></div><div id="message" class="message"></div></div>
<div class="card"><h2>Evidence File</h2><div id="viewer" class="viewer"><div class="unsupported">Loading file...</div></div></div>
</div>
<script>
if(sessionStorage.getItem('adminLoggedIn')!=='true'){window.location.replace('/admin-login.html')}
const params=new URLSearchParams(location.search);const evidenceId=params.get('evidenceId');let evidence=null;
function backToDashboard(){window.location.replace('/admin-dashboard.html')}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function size(v){const n=Number(v);if(!Number.isFinite(n))return '-';if(n<1024)return n+' Bytes';if(n<1048576)return (n/1024).toFixed(2)+' KB';return (n/1048576).toFixed(2)+' MB'}
function date(v){if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString()}
function statusClass(s){s=String(s||'PENDING').toUpperCase();return s==='APPROVED'?'approved':s==='REJECTED'?'rejected':'pending'}
function renderStatus(st){const el=document.getElementById('statusValue');if(el){el.className='status '+statusClass(st);el.textContent=st}}
async function load(){
 if(!evidenceId){document.getElementById('info').innerHTML='<div class="error">Evidence ID is missing.</div>';return}
 try{
  const r=await fetch('/api/evidence/'+encodeURIComponent(evidenceId));
  if(!r.ok)throw new Error('Evidence not found');
  evidence=await r.json();
  const st=String(evidence.verificationStatus||'PENDING').toUpperCase();
  document.getElementById('info').innerHTML=`<div class="info-grid">
  <div class="info"><div class="label">Evidence ID</div><div class="value">${esc(evidence.evidenceId)}</div></div>
  <div class="info"><div class="label">Complaint ID</div><div class="value">${esc(evidence.complaintId)}</div></div>
  <div class="info"><div class="label">File Name</div><div class="value">${esc(evidence.originalFileName)}</div></div>
  <div class="info"><div class="label">File Type</div><div class="value">${esc(evidence.fileType||'-')}</div></div>
  <div class="info"><div class="label">File Size</div><div class="value">${size(evidence.fileSize)}</div></div>
  <div class="info"><div class="label">Uploaded At</div><div class="value">${date(evidence.uploadedAt)}</div></div>
  <div class="info"><div class="label">SHA-256 Hash</div><div class="value">${esc(evidence.sha256Hash||'-')}</div></div>
  <div class="info"><div class="label">Verification Status</div><div class="value"><span id="statusValue" class="status ${statusClass(st)}">${esc(st)}</span></div></div>
  </div>`;
  const actions=document.getElementById('actions');actions.style.display='flex';actions.innerHTML=`<button class="btn approve" onclick="setStatus('APPROVED')">✓ Accept Evidence</button><button class="btn reject" onclick="rejectEvidence()">✕ Reject Evidence</button><button class="btn download" onclick="downloadFile()">⬇ Download</button><button class="btn delete" onclick="deleteEvidence()">🗑 Delete Evidence</button><button class="btn back-btn" onclick="backToDashboard()">↩ Back to Dashboard</button>`;
  document.getElementById('viewer').innerHTML=`<iframe src="/api/evidence/file/${encodeURIComponent(evidenceId)}" title="Evidence file"></iframe>`;
 }catch(e){console.error(e);document.getElementById('info').innerHTML='<div class="error">Unable to load evidence information.</div>';document.getElementById('viewer').innerHTML='<div class="unsupported">The evidence file could not be loaded.</div>'}
}
async function setStatus(status,reason=''){
 try{
  const r=await fetch('/api/evidence/'+encodeURIComponent(evidenceId)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,rejectionReason:reason})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||'Status update failed');
  const newStatus=String(d.verificationStatus||status).toUpperCase();
  renderStatus(newStatus);
  document.getElementById('message').textContent=d.message||('Evidence '+newStatus.toLowerCase()+' successfully.');
 }catch(e){alert(e.message||'Unable to update evidence status.')}
}
function rejectEvidence(){const reason=prompt('Enter reason for rejecting this evidence:');if(!reason||!reason.trim())return;setStatus('REJECTED',reason.trim())}
function downloadFile(){window.location.href='/api/evidence/download/'+encodeURIComponent(evidenceId)}
async function deleteEvidence(){
 if(!confirm('Delete this evidence? This will remove the database record and stored evidence file.'))return;
 try{
  const r=await fetch('/api/evidence/'+encodeURIComponent(evidenceId),{method:'DELETE'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||'Delete failed');
  document.getElementById('message').textContent=d.message||'Evidence deleted successfully.';
  setTimeout(backToDashboard,500);
 }catch(e){alert(e.message||'Unable to delete evidence.')}
}
load();
</script>
</body>
</html>
